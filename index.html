<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #f8f9fa;
            color: #2d3436;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column
        }

        header {
            background: linear-gradient(135deg, #4a90d9, #357abd);
            color: #fff;
            text-align: center;
            padding: 2.5rem 1rem
        }

        header h1 {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            letter-spacing: -0.5px
        }

        header p {
            opacity: .85;
            margin-top: .5rem;
            font-size: 1.05rem
        }

        main {
            max-width: 720px;
            margin: 2rem auto;
            padding: 0 1.2rem;
            flex: 1
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 1.8rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .06);
            transition: transform .2s, box-shadow .2s
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, .1)
        }

        .card h2 {
            color: #4a90d9;
            margin-bottom: .6rem;
            font-size: 1.35rem
        }

        .card p {
            color: #555;
            font-size: .98rem
        }

        .btn {
            display: inline-block;
            margin-top: .8rem;
            padding: .55rem 1.4rem;
            background: #4a90d9;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            font-size: .9rem;
            transition: background .2s
        }

        .btn:hover {
            background: #357abd
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: #999;
            font-size: .85rem;
            border-top: 1px solid #e9ecef
        }
    </style>
</head>

<body>
    <header>
        <h1>👋 欢迎来到我的主页</h1>
        <p>分享想法 · 记录成长 · 连接世界</p>
    </header>
    <main>
        <div class="card">
            <h2>📌 关于我</h2>
            <p>热爱技术、设计与写作。这里是我的数字花园，记录学习笔记与生活灵感。</p>
            <a href="#" class="btn">了解更多</a>
        </div>
        <div class="card">
            <h2>📝 最新文章</h2>
            <p>探索前端开发、开源工具与高效工作流，用简洁的方式解决有趣的问题。</p>
            <a href="#" class="btn">阅读文章</a>
        </div>
        <div class="card">
            <h2>📬 联系我</h2>
            <p>欢迎通过邮件或社交媒体交流想法，一起碰撞灵感的火花。</p>
            <a href="#" class="btn">发送邮件</a>
        </div>
    </main>
    <footer>© 2026 MySite · 由 GitHub Pages 驱动</footer>
</body>

</html>
